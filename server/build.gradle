plugins {
  id 'application'
}

application {
  mainClassName = 'demo.Server'
  applicationDefaultJvmArgs = ['-DIce.Config=$APP_HOME/config/config.server']
}

dependencies {
  implementation project(':common')
  implementation 'com.zeroc:ice:3.7.10'
}

distributions {
  main {
    contents {
      from('src/main/resources') { into 'config' }
    }
  }
}
